version: '3.7'
services:
  mysql:
    image: mysql:8.0
    container_name: deadline-mysql
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=app
      - MYSQL_USER=app
      - MYSQL_PASSWORD=pass
    volumes:
      - ./dbInit:/docker-entrypoint-initdb.d